version: 2

builds:
  - main: ./cmd/rmine
    binary: rmine
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mehboobali98/rmine/internal/cli.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
